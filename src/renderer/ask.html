<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Ask screen-ink</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
      }
      .preview {
        background: linear-gradient(135deg, #8aa7c9, #c9b8d8);
      }
      .preview main {
        margin: 24px auto 0;
      }
      main {
        width: 624px;
        margin: 8px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 18px;
        border-radius: 16px;
        background: rgba(24, 26, 32, 0.94);
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        box-sizing: border-box;
      }
      .pen {
        color: #ff5a36;
        font-size: 20px;
      }
      input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #fff;
        font: 400 18px -apple-system, 'SF Pro Text', system-ui, sans-serif;
        caret-color: #ff5a36;
      }
      input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }
      .mic {
        display: none;
        flex: none;
        width: 12px;
        height: 12px;
        margin: 0 4px;
        border-radius: 50%;
        background: #ff5a36;
        box-shadow: 0 0 0 calc(var(--level, 0) * 9px) rgba(255, 90, 54, 0.28);
        transition: box-shadow 0.06s;
      }
      .listening .mic {
        display: block;
      }
      .listening .pen {
        display: none;
      }
      input.heard {
        color: rgba(255, 255, 255, 0.72);
      }
      .thinking input {
        color: rgba(255, 255, 255, 0.55);
      }
      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ff5a36;
        animation: spin 0.8s linear infinite;
      }
      .thinking .spinner {
        display: block;
      }
      .hint {
        color: rgba(255, 255, 255, 0.35);
        font-size: 12px;
        white-space: nowrap;
      }
      .thinking .hint {
        display: none;
      }
      #message {
        display: none;
        margin: 8px 6px 0;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(24, 26, 32, 0.94);
        color: #ff8f73;
        font-size: 13px;
        line-height: 1.35;
      }
      .error #message {
        display: block;
      }
      .thinking #message:not(:empty) {
        display: block;
        color: rgba(255, 255, 255, 0.6);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main id="root">
      <div class="bar">
        <span class="pen">✎</span>
        <span class="mic" id="mic"></span>
        <input id="question" placeholder="Ask about your screen…" autocomplete="off" spellcheck="false" />
        <span class="spinner"></span>
        <span class="hint" id="hint">↵ ask · esc close</span>
      </div>
      <div id="message"></div>
    </main>
    <script src="ask.js"></script>
  </body>
</html>
